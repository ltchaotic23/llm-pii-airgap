name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist llm-pii-airgap

      - name: Check the wheel's contents and the installed command
        env:
          AIRGAP_WHEEL_DIR: dist
          AIRGAP_INSTALLED: "1"
        run: python -m unittest discover -s tests -p test_packaging.py -v
